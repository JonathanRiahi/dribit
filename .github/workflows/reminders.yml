# Daily reminder for Dribit: one Web Push message in the evening (from 18:00 Israel time) to everyone who turned reminders on
# and has not finished a lesson today. The sending logic is in tools/send-reminders.js.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   POSTHOG_API_KEY    a PostHog personal API key with the query:read scope (reads the subscriptions and today's lessons)
#   VAPID_PRIVATE_KEY  the private half of reminders.vapidPublicKey in config.js
# Optional: POSTHOG_PROJECT_ID (the project number from PostHog > Settings > Project; found via the API otherwise).
name: Daily reminders

on:
  schedule:
    # The main trigger is NOT this schedule: a Claude scheduled task runs this workflow (workflow_dispatch, backup=true)
    # every day at 18:04 Israel time. GitHub creates only a few scheduled runs for this repository, all late
    # (17-19.10.2026: 4 of 30 half-hour slots; on 19.10 the only one came at 23:17, so nobody got a reminder). This cron
    # is the fallback: every 10 minutes, off the busy :00 and :30, from 15:07 to 19:57 UTC, which covers 18:00 to 21:59
    # Israel time in summer (UTC+3) and in winter (UTC+2). If the Claude task is turned off, reminders depend on it alone.
    # The script sends only inside that window and at most one reminder a day per person; other runs stop right away.
    - cron: '7,17,27,37,47,57 15-19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Count only, send nothing'
        type: boolean
        default: false
      only_latest:
        description: 'Test: send only to whoever used the app last (even if already reminded today)'
        type: boolean
        default: false
      everyone:
        description: 'Send now to everyone with reminders on (even if already reminded or active today)'
        type: boolean
        default: false
      message:
        description: 'Text for a test or everyone send: one line, up to 180 characters (empty: the default text)'
        type: string
        required: false
        default: ''
      backup:
        description: 'The daily 18:04 trigger: keep the 18:00-21:59 window (a late run sends nothing)'
        type: boolean
        default: false
      diagnose:
        description: 'Send nothing: show what happened to each subscription in the last 3 days (delete the log after reading)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency: reminders

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock --no-audit --no-fund web-push@3.6.7
      - run: node tools/send-reminders.js
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          # a manual run sends right away, whatever the hour (still at most once a day per person); the daily backup
          # trigger (backup=true) keeps the window, so a late one sends nothing
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.backup != true && '1' || '' }}
          ONLY_LATEST: ${{ inputs.only_latest == true && '1' || '' }}
          EVERYONE: ${{ inputs.everyone == true && '1' || '' }}
          MESSAGE: ${{ inputs.message }}
          DIAGNOSE: ${{ inputs.diagnose == true && '1' || '' }}
