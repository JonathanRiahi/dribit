# Landing page report: visitors from TikTok and elsewhere, how far they scrolled, how many signed up.
# Actions > Landing report > Run workflow. The log shows only counts (no phones, emails or names).
# Uses the same POSTHOG_API_KEY / POSTHOG_PROJECT_ID secrets as the daily reminders.
name: Landing report

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'From date (YYYY-MM-DD, UTC). Empty: 2026-10-25'
        type: string
        required: false
        default: ''
  push:
    branches: ['claude/project-thread-u863ks']
    paths: ['tools/landing-report.js', '.github/workflows/landing-report.yml']

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/landing-report.js
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          # optional: old device ids of Jonathan and Nehorai that can no longer be marked (see tools/team.js)
          TEAM_IDS: ${{ secrets.TEAM_IDS }}
          SINCE: ${{ inputs.since }}
