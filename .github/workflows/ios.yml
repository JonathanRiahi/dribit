# The iPhone app (the ios/ folder): a native shell around the live web app.
# Every change under ios/ is built here on a Mac in the cloud and opened in an iPhone simulator; the pictures of what it
# shows are kept with the run (Artifacts > ios-screens) and on the side ref refs/ios-shots/latest.
# To send a build to App Store Connect: Actions > iOS app > Run workflow > tick "upload". That needs four repository
# secrets (Settings > Secrets and variables > Actions): APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8.
name: iOS app

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Sign the app and upload it to App Store Connect'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    name: Build and open in a simulator
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write # the last step keeps the pictures on a side ref of this repository (refs/ios-shots/latest)
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          xcodebuild -version
          which xcodegen || brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          xcodebuild -project Dribit.xcodeproj -scheme Dribit -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -n -E "error:|error generated|fatal" build.log | head -60; echo "----- end of log -----"; tail -n 40 build.log; exit 1; }
          echo "Built. Warnings in our own files:"
          grep -E "Dribit/.*warning:" build.log | sed 's/.*Dribit\//Dribit\//' | sort -u | head -40 || true

      # The same app, pointed at this checkout served from the build machine (http://localhost:8765) instead of the live
      # site: a change to the web app is tried inside the iPhone app before it is live.
      - name: Build the copy that shows this branch's web app
        working-directory: ios
        run: |
          cp Dribit/Info.plist "$RUNNER_TEMP/Info-local.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$RUNNER_TEMP/Info-local.plist"
          xcodebuild -project Dribit.xcodeproj -scheme Dribit -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-local CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_FILE="$RUNNER_TEMP/Info-local.plist" APP_HOST=localhost "APP_START_URL=http://localhost:8765/?source=ios" APP_PATH_PREFIX=/ \
            build > build-local.log 2>&1 \
            || { grep -n -E "error:|error generated|fatal" build-local.log | head -60; echo "----- end of log -----"; tail -n 40 build-local.log; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :DribitStartURL" -c "Print :WKAppBoundDomains" build-local/Build/Products/Debug-iphonesimulator/Dribit.app/Info.plist

      - name: Start an iPhone simulator
        run: |
          mkdir -p shots logs
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' not in runtime: continue
              version = tuple(int(n) for n in runtime.split('iOS-')[-1].split('-'))
              for d in devices:
                  if 'iPhone' not in d['name']: continue
                  key = (version, 'Pro Max' in d['name'], d['name'])
                  if best is None or key > best[0]: best = (key, d['udid'], d['name'], runtime)
          sys.stderr.write('Simulator: %s (%s)\n' % (best[2], best[3]))
          print(best[1])")
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

      - name: The live site inside the app
        run: |
          set -x
          APP=ios/build/Build/Products/Debug-iphonesimulator/Dribit.app
          xcrun simctl install "$DEVICE" "$APP"
          # The build machine is sometimes slow, so nothing here counts seconds: each picture waits until the app
          # has written the given words to its log (up to a minute), and then a moment more for the screen to settle.
          logged() {
            for try in $(seq 1 60); do
              if grep -a -q "$2" "logs/$1.log" 2>/dev/null; then sleep "${3:-2}"; return 0; fi
              sleep 1
            done
            echo "::warning::$1: \"$2\" was not written within a minute"
          }

          # 1. a normal first open, with the bridge check running inside the page
          xcrun simctl launch --stderr="$PWD/logs/run1.log" "$DEVICE" com.dribit.app -dribitJS "$(cat ios/tests/check.js)"
          sleep 1;  xcrun simctl io "$DEVICE" screenshot shots/01-opening.png
          logged run1 "DRIBIT-TEST done = true"; xcrun simctl io "$DEVICE" screenshot shots/02-first-screen.png

          # 2. a second open: what was saved on the phone is still there, and the offline copy is in place
          xcrun simctl terminate "$DEVICE" com.dribit.app
          xcrun simctl launch --stderr="$PWD/logs/run2.log" "$DEVICE" com.dribit.app -dribitJS "$(cat ios/tests/check.js)"
          logged run2 "DRIBIT-TEST done = true"; xcrun simctl io "$DEVICE" screenshot shots/03-second-open.png
          xcrun simctl terminate "$DEVICE" com.dribit.app
          xcrun simctl uninstall "$DEVICE" com.dribit.app

          set +x
          echo "===== bridge check, first open ====="
          grep -a "DRIBIT-" logs/run1.log | sed 's/.*DRIBIT-[A-Z]* //' || echo "(nothing logged)"
          echo "===== bridge check, second open ====="
          grep -a "DRIBIT-" logs/run2.log | sed 's/.*DRIBIT-[A-Z]* //' || echo "(nothing logged)"
          grep -a -q "DRIBIT-TEST done = true" logs/run1.log || { echo "::error::The bridge check did not finish"; tail -n 30 logs/run1.log; exit 1; }

      - name: This branch's web app inside the app
        run: |
          set -x
          # the site's files, served from this machine; "serve" waits until it really answers
          serve() {
            python3 ios/tests/serve.py 8765 >> logs/server.log 2>&1 & SERVER=$!
            for try in $(seq 1 40); do
              if curl -sf -o /dev/null http://localhost:8765/config.js; then echo "The local copy of the site answers (try $try)"; return 0; fi
              sleep 1
            done
            echo "::error::The local copy of the site did not start"; tail -n 20 logs/server.log; return 1
          }
          logged() {
            for try in $(seq 1 60); do
              if grep -a -q "$2" "logs/$1.log" 2>/dev/null; then sleep "${3:-2}"; return 0; fi
              sleep 1
            done
            echo "::warning::$1: \"$2\" was not written within a minute"
          }
          serve
          curl -sf http://localhost:8765/config.js | grep -m1 "version:"
          APP=ios/build-local/Build/Products/Debug-iphonesimulator/Dribit.app
          xcrun simctl install "$DEVICE" "$APP"

          # 3. the reminder is on (a quiet permission, given with no question, stands in for the tap on "Allow"):
          #    the next evenings must really be planned on the phone
          xcrun simctl launch --stderr="$PWD/logs/run3.log" "$DEVICE" com.dribit.app -dribitJS "window.__seed='reminder'; $(cat ios/tests/seed.js)"
          logged run3 "DRIBIT-TEST seed reminder = saved" 8; xcrun simctl io "$DEVICE" screenshot shots/04-home.png
          xcrun simctl terminate "$DEVICE" com.dribit.app
          xcrun simctl launch --stderr="$PWD/logs/run4.log" "$DEVICE" com.dribit.app -dribitJS "window.__tap='nav [data-to=\"profile\"]'; $(cat ios/tests/after.js)"
          logged run4 "DRIBIT-TEST app done = true" 3; xcrun simctl io "$DEVICE" screenshot shots/05-profile.png

          # 4. the site cannot be reached, and the app was opened before: it opens from the copy kept on the phone
          xcrun simctl terminate "$DEVICE" com.dribit.app
          kill "$SERVER"; wait "$SERVER" 2>/dev/null || true
          xcrun simctl launch --stderr="$PWD/logs/run5.log" "$DEVICE" com.dribit.app -dribitJS "$(cat ios/tests/after.js)"
          logged run5 "DRIBIT-TEST app done = true"; xcrun simctl io "$DEVICE" screenshot shots/06-open-without-connection.png

          # 5. the site cannot be reached, and the app was never opened: the app's own "no connection" screen
          xcrun simctl terminate "$DEVICE" com.dribit.app
          xcrun simctl uninstall "$DEVICE" com.dribit.app
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch --stderr="$PWD/logs/run6.log" "$DEVICE" com.dribit.app
          logged run6 "DRIBIT-APP no connection screen"; xcrun simctl io "$DEVICE" screenshot shots/07-no-connection.png
          xcrun simctl terminate "$DEVICE" com.dribit.app
          xcrun simctl uninstall "$DEVICE" com.dribit.app

          # 6. someone who finished one lesson yesterday opens the app: the offer to turn the reminder on
          serve
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch --stderr="$PWD/logs/run7.log" "$DEVICE" com.dribit.app -dribitJS "window.__seed='ask'; $(cat ios/tests/seed.js)"
          logged run7 "DRIBIT-TEST seed ask = saved" 10; xcrun simctl io "$DEVICE" screenshot shots/08-reminder-offer.png
          curl -s -o /dev/null -w "The local copy of the site, asked from this machine: %{http_code} in %{time_total}s\n" http://localhost:8765/config.js || true

          # 7. the next open: the same offer, and a tap on its button brings the phone's own question.
          #    Last, because the phone's question stays on the simulator's screen after the app is closed.
          xcrun simctl terminate "$DEVICE" com.dribit.app
          xcrun simctl launch --stderr="$PWD/logs/run8.log" "$DEVICE" com.dribit.app -dribitJS "window.__tap='#sheet [data-act=\"popup-reminder-on\"]'; $(cat ios/tests/after.js)"
          logged run8 "DRIBIT-TEST app done = true" 4; xcrun simctl io "$DEVICE" screenshot shots/09-reminder-question.png
          xcrun simctl terminate "$DEVICE" com.dribit.app

          set +x
          for n in 3 4 5 6 7 8; do
            echo "===== run $n ====="
            grep -a "DRIBIT-" logs/run$n.log | sed 's/.*DRIBIT-[A-Z]* //' || echo "(nothing logged)"
          done
          grep -a -q "DRIBIT-TEST app done = true" logs/run4.log || { echo "::error::The reminder check did not finish"; tail -n 30 logs/run4.log; exit 1; }
          PLANNED=$(grep -a "DRIBIT-TEST app pending-count" logs/run4.log | tail -n 1 | sed 's/.*= //')
          echo "Reminders planned on the phone: $PLANNED"
          [ "${PLANNED:-0}" -ge 13 ] || { echo "::error::Expected the next 13 or 14 evenings to be planned, found ${PLANNED:-none}"; exit 1; }
          # the copy on the phone belongs to the site's own offline support; the build machine's plain http address may not get it
          if grep -a -q 'DRIBIT-TEST app offline-copy = {"registered":true,"controlled":true}' logs/run4.log; then
            grep -a -q "DRIBIT-TEST app done = true" logs/run5.log || { echo "::error::The app did not open from the copy on the phone"; tail -n 30 logs/run5.log; exit 1; }
            echo "Opened without a connection, from the copy on the phone."
          else
            echo "::warning::No offline copy was kept for the build machine's address, so opening without a connection was not checked here"
          fi
          grep -a -q "DRIBIT-APP no connection screen" logs/run6.log || { echo "::error::The no connection screen did not come up"; tail -n 30 logs/run6.log; exit 1; }
          grep -a -q "DRIBIT-TEST app done = true" logs/run8.log || { echo "::error::The reminder offer check did not finish"; tail -n 30 logs/run8.log; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screens
          path: |
            shots
            logs
            ios/build.log
            ios/build-local.log

      # The pictures also go to a side ref (not a branch, it does not show in the list of branches), replaced on every
      # run, for looking at them without the Actions page: git fetch origin refs/ios-shots/latest
      - name: Keep the pictures on a side ref
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pictures"
          cp shots/*.png "$RUNNER_TEMP/pictures/" 2>/dev/null || true
          cp -R logs "$RUNNER_TEMP/pictures/" 2>/dev/null || true
          cd "$RUNNER_TEMP/pictures"
          ls -la
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Simulator pictures: run ${{ github.run_number }} of ${{ github.sha }}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/ios-shots/latest \
            || echo "::warning::The pictures could not be kept on the side ref"

  release:
    name: Sign and upload to App Store Connect
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    needs: simulator
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::The repository secret $name is missing"; exit 1; }
          done

      - name: The App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # the secret may hold the .p8 file as it is, or base64 of it
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > "$KEY"; else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"; fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Archive
        working-directory: ios
        run: |
          xcodebuild -project Dribit.xcodeproj -scheme Dribit -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Dribit.xcarchive" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO archive > archive.log 2>&1 \
            || { grep -n -E "error:|fatal" archive.log | head -60; tail -n 40 archive.log; exit 1; }
          echo "Archived build ${{ github.run_number }}"

      - name: Sign and upload
        working-directory: ios
        run: |
          sed "s/__TEAM__/$APPLE_TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dribit.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1 \
            || { grep -n -E "error|Error" export.log | head -60; tail -n 60 export.log; exit 1; }
          tail -n 15 export.log
          echo "Uploaded build ${{ github.run_number }}. It shows in App Store Connect (TestFlight tab) after Apple finishes processing, usually 5 to 30 minutes."
