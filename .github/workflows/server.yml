# 0.31: puts the groups and refer-a-friend server (server/) on Cloudflare's free plan.
# Needs two repository secrets (Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Without them it stops at the first step and says so. Runs on every change to server/ on main, or by hand (Run workflow).
# The first run creates the database "dribit-social"; every run applies server/schema.sql (safe to repeat) and deploys.
name: Server deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']

concurrency: server-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.40.0
    steps:
      - name: Check the secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set yet, nothing was deployed (see server/README.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Find or create the database
        if: steps.secrets.outputs.ok == 'true'
        working-directory: server
        run: |
          find_id() { $WRANGLER d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const d=a.find(x=>x.name==="dribit-social");process.stdout.write(d?d.uuid:"")}catch(e){}})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            echo "Creating the database dribit-social"
            $WRANGLER d1 create dribit-social
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then echo "::error::Could not find or create the D1 database. Does the token have D1 Edit?"; exit 1; fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          echo "database: $ID"

      - name: Apply the schema
        if: steps.secrets.outputs.ok == 'true'
        working-directory: server
        run: $WRANGLER d1 execute dribit-social --remote --file=schema.sql -y

      - name: Deploy the worker
        if: steps.secrets.outputs.ok == 'true'
        working-directory: server
        run: |
          # 0.31.1: the first deploy of a new Worker can fail to turn on its workers.dev address ("This Worker does
          # not exist", code 10007) because Cloudflare has not finished creating it. Try again, and fail loudly.
          set -o pipefail
          for i in 1 2 3; do
            if $WRANGLER deploy 2>&1 | tee deploy.log; then break; fi
            if [ "$i" = 3 ]; then echo "::error::wrangler deploy failed 3 times, see above"; exit 1; fi
            echo "Deploy failed, trying again in 15 seconds"; sleep 15
          done
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Server address" >> "$GITHUB_STEP_SUMMARY"
          echo "${URL:-not found in the log, see the deploy step}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$URL" ]; then curl -fsS "$URL/" && echo; fi
