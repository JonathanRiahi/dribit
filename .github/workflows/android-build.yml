# Builds the Android (Trusted Web Activity) wrapper of Dribit.
# Output is UNSIGNED. Signing happens outside GitHub; the upload key is never in this repo.
name: Android build
on:
  push:
    branches: ['claude/**']
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build unsigned bundle and apk
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab out/app-release-unsigned.aab
          cp app/build/outputs/apk/release/*.apk out/ || true
          ls -la out
      - name: Save outputs to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f android/out
          git commit -m "Android build output (unsigned) [skip ci]" || exit 0
          git push
