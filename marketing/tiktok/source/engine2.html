<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { background: linear-gradient(180deg, #07503f 0%, #095e4b 50%, #0c6d56 100%);
    font-family: 'Rubik', 'Assistant', sans-serif; color: #fff; position: relative; }
  .layer { position: absolute; inset: 0; opacity: 0; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 70px; }
  .gold { color: #f2b52f; } .green { color: #3ddc97; } .red { color: #ff7a6b; }
  .foot { position: absolute; bottom: 330px; left: 90px; right: 90px; font-family: 'Assistant'; font-size: 34px; font-weight: 600; opacity: .82; text-align: center; line-height: 1.3; }
  /* hook */
  .hook .pre { font-size: 72px; font-weight: 700; line-height: 1.18; }
  .hook .num { font-weight: 900; color: #f2b52f; line-height: 1; margin: 40px 0 34px; white-space: nowrap; text-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .hook .q { font-size: 66px; font-weight: 700; line-height: 1.22; }
  /* cards */
  .title { font-size: 88px; font-weight: 800; margin-bottom: 56px; line-height: 1.12; }
  .card { width: 940px; border-radius: 40px; padding: 40px 50px; text-align: right; margin-bottom: 36px;
    background: rgba(0,0,0,.28); border: 4px solid rgba(255,255,255,.14); box-shadow: 0 18px 50px rgba(0,0,0,.25); }
  .card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; }
  .card .name { font-size: 58px; font-weight: 800; }
  .card .amt { font-size: 58px; font-weight: 800; white-space: nowrap; }
  .card .desc { font-family: 'Assistant'; font-size: 46px; font-weight: 700; margin-top: 14px; line-height: 1.3; opacity: .95; }
  .card.g { border-color: #f2b52f; } .card.g .amt { color: #f2b52f; }
  .card.t { border-color: #3ddc97; } .card.t .amt { color: #3ddc97; }
  .card.r { border-color: #ff7a6b; } .card.r .amt { color: #ff7a6b; }
  .note { font-family: 'Assistant'; font-size: 46px; font-weight: 700; margin-top: 16px; line-height: 1.3; }
  /* list */
  .items { width: 940px; }
  .item { display: flex; align-items: center; gap: 30px; text-align: right; font-family: 'Assistant'; font-size: 52px; font-weight: 700; line-height: 1.22;
    background: rgba(0,0,0,.24); border-radius: 30px; padding: 26px 34px; margin-bottom: 22px; }
  .item .mk { flex: none; width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Rubik'; font-size: 46px; font-weight: 800; }
  .item.ok .mk { background: #3ddc97; color: #06392d; } .item.no .mk { background: #ff7a6b; color: #3a0d08; }
  .items.small .item { font-size: 46px; padding: 20px 30px; margin-bottom: 16px; } .items.small .mk { width: 64px; height: 64px; font-size: 40px; }
  /* phone */
  .cap { position: absolute; top: 150px; left: 60px; right: 60px; text-align: center; font-size: 74px; font-weight: 800; line-height: 1.15; }
  .phone { position: absolute; left: 100px; top: 430px; width: 880px; height: 1360px; border-radius: 56px; overflow: hidden;
    background: #0d1714; border: 6px solid #1d3a31; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .shot { position: absolute; left: 0; top: 0; width: 1170px; height: 2532px; transform-origin: 0 0; }
  .shot img { position: absolute; inset: 0; width: 1170px; height: 2532px; }
  .tap { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%;
    border: 10px solid rgba(255,255,255,.95); background: rgba(255,255,255,.25); opacity: 0; }
  .hl { position: absolute; border: 10px solid #f2b52f; border-radius: 36px; opacity: 0; box-shadow: 0 0 40px rgba(242,181,47,.6); }

  /* chat */
  .chat { padding: 0 60px; display:flex; flex-direction:column; justify-content:center; align-items:stretch; }
  .chat .ctitle { text-align:center; font-size:62px; font-weight:800; margin-bottom:50px; }
  .bub { display:flex; align-items:flex-end; gap:22px; margin-bottom:30px; opacity:0; }
  .bub.me { flex-direction:row-reverse; }
  .bub .av { flex:none; width:110px; height:110px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:800; color:#06392d; background:#9fd9c3; }
  .bub.me .av { background:#f2b52f; }
  .bub .bx { max-width:820px; background:#1f2c27; border-radius:36px 36px 36px 10px; padding:30px 44px; font-family:"Assistant"; font-size:56px; font-weight:700; line-height:1.3; box-shadow:0 12px 30px rgba(0,0,0,.3); text-align:right; }
  .bub.me .bx { background:#0b5a48; border:3px solid #3ddc97; border-radius:36px 36px 10px 36px; }
  .bub .nm { font-size:34px; font-weight:700; color:#3ddc97; margin-bottom:6px; }
  .bub.me .nm { color:#f2b52f; }
  .dots span { display:inline-block; width:18px; height:18px; border-radius:50%; background:#fff; margin:0 6px; opacity:.5; }
  /* end v2 */
  .end .logo { width:200px; height:200px; border-radius:44px; box-shadow:0 20px 50px rgba(0,0,0,.4); }
  .end .url { direction:ltr; font-size:150px; font-weight:900; color:#f2b52f; line-height:1; margin-top:40px; letter-spacing:-2px; text-shadow:0 10px 40px rgba(0,0,0,.35); }
  .end .sub { font-family:'Assistant'; font-size:42px; font-weight:700; margin-top:40px; line-height:1.35; opacity:.92; }
  .end .sub b { color:#f2b52f; }
  /* end */
  .end .coin { width: 170px; height: 170px; border-radius: 50%; background: #f2b52f; border: 10px solid #d99a1b;
    display: flex; align-items: center; justify-content: center; font-size: 90px; font-weight: 800; color: #b07a10; }
  .end .brand { font-size: 120px; font-weight: 800; margin-top: 18px; line-height: 1.1; }
  .end .tag { font-size: 62px; font-weight: 500; margin-top: 16px; line-height: 1.25; }
  .end .btn { margin-top: 60px; background: #f2b52f; color: #1b1b1b; font-size: 58px; font-weight: 800; border-radius: 100px; padding: 34px 64px; box-shadow: 0 14px 40px rgba(0,0,0,.3); }
  .end .bio { font-size: 52px; font-weight: 700; margin-top: 34px; }
</style>
</head>
<body>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const out = x => 1 - Math.pow(1 - x, 3);
const inout = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const X = 0.22, SCALE = 880 / 1170;
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

function build(spec) {
  let t0 = 0;
  spec.scenes.forEach(s => {
    s.start = t0; s.end = t0 + s.dur; t0 = s.end;
    const L = el('div', 'layer ' + (s.type === 'phone' ? 'sc-phone' : s.type) + (['hook', 'cards', 'list', 'end'].includes(s.type) ? ' center' : ''));
    if (s.type === 'hook') {
      L.append(el('div', 'pre', s.pre));
      s.numEl = el('div', 'num', s.num); s.numEl.style.fontSize = (s.numSize || 200) + 'px'; L.append(s.numEl);
      s.qEl = el('div', 'q gold', s.q || ''); L.append(s.qEl);
      if (s.foot) L.append(el('div', 'foot', s.foot));
    } else if (s.type === 'cards') {
      if (s.title) L.append(el('div', 'title', s.title));
      s.cardEls = s.cards.map(c => { const e = el('div', 'card ' + (c.cls || ''), `<div class="row"><div class="name">${c.name}</div><div class="amt">${c.amt || ''}</div></div>` + (c.desc ? `<div class="desc">${c.desc}</div>` : '')); L.append(e); return e; });
      if (s.note) { s.noteEl = el('div', 'note ' + (s.noteCls || 'gold'), s.note); L.append(s.noteEl); }
      if (s.foot) L.append(el('div', 'foot', s.foot));
    } else if (s.type === 'list') {
      if (s.title) L.append(el('div', 'title', s.title));
      const box = el('div', 'items' + (s.small ? ' small' : ''));
      s.itemEls = s.items.map(it => { const e = el('div', 'item ' + (it.no ? 'no' : 'ok'), `<div class="mk">${it.no ? '✕' : '✓'}</div><div>${it.t}</div>`); box.append(e); return e; });
      L.append(box);
      if (s.note) { s.noteEl = el('div', 'note gold', s.note); L.append(s.noteEl); }
      if (s.foot) L.append(el('div', 'foot', s.foot));
    } else if (s.type === 'phone') {
      L.append(el('div', 'cap', s.cap.map(x => `<div>${x}</div>`).join('')));
      const ph = el('div', 'phone'), sh = el('div', 'shot');
      const im = el('img'); im.src = '../shots/' + s.shot; sh.append(im);
      s.tapEl = el('div', 'tap'); sh.append(s.tapEl);
      s.hlEl = el('div', 'hl'); if (s.hl) Object.assign(s.hlEl.style, { left: s.hl.x + 'px', top: s.hl.y + 'px', width: s.hl.w + 'px', height: s.hl.h + 'px' }); sh.append(s.hlEl);
      ph.append(sh); L.append(ph); s.shotEl = sh; s.phoneEl = ph;
    } else if (s.type === 'chat') {
      L.classList.add('chat');
      if (s.title) L.append(el('div', 'ctitle', s.title));
      s.bubEls = s.msgs.map(m => { const e = el('div', 'bub' + (m.me ? ' me' : ''), `<div class="av">${m.av || m.name[0]}</div><div class="bx"><div class="nm">${m.name}</div><div>${m.text}</div></div>`); L.append(e); return e; });
      if (s.foot) L.append(el('div', 'foot', s.foot));
    } else if (s.type === 'end') {
      const im = el('img', 'logo'); im.src = 'icon.svg'; L.append(im);
      L.append(el('div', 'brand', 'דריבית'));
      L.append(el('div', 'tag', s.tag || 'לומדים על כסף, כמה דקות ביום'));
      L.append(el('div', 'url', 'dribit.app'));
      s.btnEl = el('div', 'btn', s.btn || 'לתפוס מקום ברשימה'); L.append(s.btnEl);
      L.append(el('div', 'sub', s.sub || 'בחינם. <b>האפליקציה יוצאת לפי הסדר ברשימה.</b>'));
      L.append(el('div', 'foot', s.foot || 'מידע כללי לחינוך פיננסי, לא ייעוץ השקעות.'));
      s.coinEl = im;
    }
    s.L = L; document.body.append(L);
  });
  spec.total = t0;
  // fit big numbers into the width
  spec.scenes.filter(s => s.type === 'hook').forEach(s => { const w = s.numEl.scrollWidth; if (w > 960) s.numEl.style.fontSize = (parseFloat(s.numEl.style.fontSize) * 960 / w) + 'px'; });
}

function render(t) {
  const sc = SPEC.scenes;
  sc.forEach((s, i) => {
    const first = i === 0, last = i === sc.length - 1;
    const a = first ? -1 : lin(t, s.start - X / 2, s.start + X / 2);
    const b = last ? 0 : lin(t, s.end - X / 2, s.end + X / 2);
    const op = first ? 1 - b : Math.min(a, 1 - b);
    s.L.style.opacity = op; s.L.style.visibility = op <= 0.001 ? 'hidden' : 'visible';
    if (op <= 0.001) return;
    const lt = t - s.start;
    const prevPhone = i > 0 && sc[i - 1].type === 'phone';
    if (s.type === 'hook') {
      s.numEl.style.transform = `scale(${1.12 - 0.12 * out(lin(lt, 0, 0.4))})`;
      const qa = s.qAt ?? 0.9;
      s.qEl.style.opacity = lin(lt, qa, qa + 0.25);
      s.qEl.style.transform = `translateY(${30 * (1 - out(lin(lt, qa, qa + 0.35)))}px)`;
    } else if (s.type === 'cards' || s.type === 'list') {
      const els = s.cardEls || s.itemEls, at = s.at || els.map((_, k) => 0.3 + k * 0.6);
      els.forEach((e, k) => { const q = lin(lt, at[k], at[k] + 0.45); e.style.opacity = lin(lt, at[k], at[k] + 0.12); e.style.transform = `translateX(${(1 - back(q)) * 1100}px)`; });
      if (s.noteEl) { const na = s.noteAt ?? (at[at.length - 1] + 0.8); s.noteEl.style.opacity = lin(lt, na, na + 0.25); }
    } else if (s.type === 'phone') {
      if (!prevPhone) s.L.style.transform = `translateY(${(1 - out(lin(lt, -0.1, 0.35))) * 120}px)`;
      const k = inout(lin(lt, s.panAt ?? 0.2, s.dur - 0.1));
      const y = s.y0 + (s.y1 - s.y0) * k;
      s.shotEl.style.transform = `scale(${SCALE}) translateY(${-y}px)`;
      s.tapEl.style.opacity = 0;
      (s.taps || []).forEach(([tt, x, yy]) => { if (lt >= tt && lt <= tt + 0.45) { const q = lin(lt, tt, tt + 0.45); Object.assign(s.tapEl.style, { left: x + 'px', top: yy + 'px', opacity: 1 - q, transform: `scale(${0.6 + q * 0.8})` }); } });
      if (s.hl) s.hlEl.style.opacity = lin(lt, s.hl.at, s.hl.at + 0.25);
    } else if (s.type === 'chat') {
      const at = s.at || s.bubEls.map((_, k) => 0.25 + k * 0.7);
      s.bubEls.forEach((e, k) => { const q = lin(lt, at[k], at[k] + 0.4); e.style.opacity = lin(lt, at[k], at[k] + 0.15); e.style.transform = `translateY(${(1 - back(q)) * 80}px) scale(${0.85 + 0.15 * back(q)})`; });
    } else if (s.type === 'end') {
      const ek = back(lin(lt, 0, 0.5));
      s.coinEl.style.transform = `scale(${ek}) rotate(${(1 - ek) * -20}deg)`;
      s.btnEl.style.transform = `scale(${lt > 0.8 ? 1 + 0.04 * Math.sin((lt - 0.8) * 6) : out(lin(lt, 0.3, 0.7))})`;
    }
  });
}

(async () => {
  const name = new URLSearchParams(location.search).get('s');
  await new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = 'spec_' + name + '.js'; sc.onload = ok; sc.onerror = bad; document.head.append(sc); });
  await document.fonts.ready;
  build(SPEC);
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  render(0);
  window.READY = true;
})();
</script>
</body>
</html>
