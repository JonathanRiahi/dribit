<body>
<!-- 0.24: something on the screen while app.js and the lessons load (a blank page in the TikTok browser looks broken).
     The app replaces it on its first render. -->
<div id="app"><div style="min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;font-size:18px;opacity:.7">פותחים את דריבית...</div></div>
<script>
// 0.24: a visitor sent here by dribit.app (?lp=, landing-5) reports that the page arrived, before the big files load,
// under the same anonymous id as the visit. landing_view → app_boot → app_opened shows where people drop off.
(function () {
  var m = /[?&]lp=([A-Za-z0-9-]{8,64})/.exec(location.search);
  if (!m) return;
  try { if (sessionStorage.getItem('dribit.boot') === m[1]) return; sessionStorage.setItem('dribit.boot', m[1]); } catch (e) { /* ignore */ }
  var body = JSON.stringify({ api_key: 'phc_tsse5UQex6pJhPK4yZkLjXLTXykftLFo8BXibrXa3Bqm', batch: [{ event: 'app_boot', timestamp: new Date().toISOString(),
    properties: { distinct_id: m[1], landing_version: 'landing-5', $current_url: location.href.split('#')[0] } }] });
  try { navigator.sendBeacon('https://eu.i.posthog.com/batch/', new Blob([body], { type: 'text/plain' })); } catch (e) { /* ignore */ }
})();
</script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
