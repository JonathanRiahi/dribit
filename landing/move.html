<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E6E58">
<title>דריבית</title>
<style>html, body { margin: 0; height: 100%; background: #0E6E58; }</style>
<script>
// 0.32: the app moved its address from jonathanriahi.github.io/dribit/ to dribit.app/app/. A phone keeps progress
// separately for every address, so the first open at dribit.app comes here (index.html) and this page sends the
// progress saved at this address back to dribit.app, after the # (the part of an address that is never sent to a server).
// It sends only to https://dribit.app/app/, and marks this phone as moved, so a browser tab of the old address goes on to
// dribit.app from now on (index.html). Lives under landing/ so no version of the app's service worker answers for it.
(function () {
  var HOME = 'https://dribit.app/app/';
  var KEYS = ['dribit.progress.v1', 'dribit.notifNo.v1', 'dribit.asks.v1'];
  var m = /^#back=(.*)$/.exec(location.hash || ''), back = HOME, data = '0';
  try { if (m) back = decodeURIComponent(m[1]).split('#')[0]; } catch (e) { /* keep HOME */ }
  if (back.indexOf(HOME) !== 0) back = HOME;
  try {
    var out = {};
    KEYS.forEach(function (k) { var v = localStorage.getItem(k); if (v != null) out[k] = v; });
    if (out[KEYS[0]]) data = btoa(unescape(encodeURIComponent(JSON.stringify(out)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    localStorage.setItem('dribit.movedTo', 'dribit.app ' + new Date().toISOString());
  } catch (e) { /* storage blocked: nothing to send */ }
  location.replace(back + '#move=' + data);
})();
</script>
</head>
<body></body>
</html>
